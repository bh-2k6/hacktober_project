<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TraceBack</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2.5' stroke-linecap='round'><circle cx='10' cy='10' r='6.5'/><line x1='15' y1='15' x2='20.5' y2='20.5'/></svg>">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <svg class="brand-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><line x1="15" y1="15" x2="20.5" y2="20.5"/></svg>
            <span class="brand-text">TraceBack</span>
        </div>
        <div class="nav-links">
            <a href="#/" class="nav-link" data-route="dashboard">Dashboard</a>
            <a href="#/report/lost" class="nav-link" data-route="report-lost">Report Lost</a>
            <a href="#/report/found" class="nav-link" data-route="report-found">Report Found</a>
            <a href="#/browse/lost" class="nav-link" data-route="browse-lost">Lost Items</a>
            <a href="#/browse/found" class="nav-link" data-route="browse-found">Found Items</a>
            <a href="#/matches" class="nav-link" data-route="matches">Matches</a>
        </div>
        <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
            <span></span><span></span><span></span>
        </button>
    </nav>

    <main class="main-content" id="app">
        <div class="loading-screen">
            <div class="spinner"></div>
            <p>Loading...</p>
        </div>
    </main>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modal">
            <button class="modal-close" id="modalClose">&times;</button>
            <div class="modal-content" id="modalContent"></div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="/static/js/app.js"></script>
</body>
</html>
